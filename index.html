<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#01696f">
<title>Potager Nexus — carnet de jardin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
<style>
:root, [data-theme="light"] {
  --color-bg:#f7f6f2; --color-surface:#f9f8f5; --color-surface-2:#fbfbf9; --color-surface-offset:#f3f0ec;
  --color-divider:#dcd9d5; --color-border:#d4d1ca; --color-text:#28251d; --color-text-muted:#6b6a65;
  --color-text-faint:#a8a7a2; --color-text-inverse:#f9f8f4;
  --color-primary:#01696f; --color-primary-hover:#0c4e54; --color-primary-highlight:#cedcd8;
  --color-success:#437a22; --color-error:#a12c7b; --color-warning:#964219;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80 / .06); --shadow-md:0 4px 12px oklch(0.2 0.01 80 / .08); --shadow-lg:0 12px 32px oklch(0.2 0.01 80 / .12);
}
[data-theme="dark"] {
  --color-bg:#171614; --color-surface:#1c1b19; --color-surface-2:#201f1d; --color-surface-offset:#1d1c1a;
  --color-divider:#262523; --color-border:#393836; --color-text:#cdccca; --color-text-muted:#9a9996;
  --color-text-faint:#5a5957; --color-text-inverse:#171614;
  --color-primary:#4f98a3; --color-primary-hover:#6bb0ba; --color-primary-highlight:#26383a;
  --color-success:#6daa45; --color-error:#d163a7; --color-warning:#d98a5c;
  --shadow-sm:0 1px 2px oklch(0 0 0 / .2); --shadow-md:0 4px 12px oklch(0 0 0 / .3); --shadow-lg:0 12px 32px oklch(0 0 0 / .4);
}
:root {
  --text-xs:clamp(.875rem,.82rem + .1vw,.9rem); --text-sm:clamp(.9375rem,.88rem + .2vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem); --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem;
  --radius-sm:.375rem; --radius-md:.5rem; --radius-lg:.75rem; --radius-xl:1rem; --radius-full:9999px;
  --font-body:'Satoshi','Inter',system-ui,sans-serif;
  --ease:180ms cubic-bezier(.16,1,.3,1); --header-h:60px; --nav-w:96px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 16px)}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);line-height:1.6}
img{display:block;max-width:100%;height:auto}
input,button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:disabled{opacity:.55;cursor:progress}
h1,h2,h3{line-height:1.2;letter-spacing:-.02em;text-wrap:balance;font-weight:700}
p,li{text-wrap:pretty;max-width:72ch}
a{color:var(--color-primary)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-sm)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--color-text-muted)}
.app-header{position:sticky;top:0;z-index:100;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding-inline:var(--space-4);background:var(--color-surface);border-bottom:1px solid var(--color-divider)}
.logo{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--text-lg);color:var(--color-text);text-decoration:none}
.logo svg{color:var(--color-primary)}
.header-actions{display:flex;align-items:center;gap:var(--space-2)}
.backup-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--color-primary-highlight);border-bottom:1px solid var(--color-divider)}
.backup-bar.dirty{background:color-mix(in oklab,var(--color-warning) 16%,var(--color-surface))}
.backup-status{display:flex;align-items:flex-start;gap:var(--space-2);font-size:var(--text-sm);flex:1;min-width:230px}
.backup-status svg{flex:none;margin-top:3px}
.backup-bar.dirty .backup-status svg{color:var(--color-warning)}
.backup-bar .btn{flex:1 1 auto}
@media (min-width:768px){.backup-bar{margin-left:var(--nav-w);padding-inline:var(--space-8)}.backup-bar .btn{flex:0 0 auto}}
.sidenav{position:fixed;z-index:90;left:0;right:0;bottom:0;display:flex;background:var(--color-surface);border-top:1px solid var(--color-divider);padding-bottom:env(safe-area-inset-bottom)}
.sidenav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:var(--space-2) var(--space-1);font-size:var(--text-xs);font-weight:500;color:var(--color-text-muted);text-decoration:none}
.sidenav a[aria-current="page"]{color:var(--color-primary);font-weight:700}
main{padding:var(--space-6) var(--space-4) calc(88px + env(safe-area-inset-bottom));max-width:1100px;margin-inline:auto}
main:focus{outline:none}
@media (max-width:767px){.btn-label{display:none}.app-header .btn-primary .btn-label{display:inline}}
@media (min-width:768px){
  .sidenav{top:var(--header-h);bottom:auto;right:auto;width:var(--nav-w);flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--color-divider);padding-top:var(--space-3)}
  .sidenav a{flex:0 0 auto;min-height:72px}
  main{margin-left:var(--nav-w);max-width:none;padding:var(--space-8) var(--space-8) var(--space-12)}
  .main-inner{max-width:1100px}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:44px;padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:600;border:1px solid transparent;text-decoration:none;transition:background var(--ease),border-color var(--ease),color var(--ease)}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-secondary{background:var(--color-surface-offset);color:var(--color-text);border-color:var(--color-divider)}
.btn-secondary:hover{background:var(--color-surface-2);border-color:var(--color-border)}
.btn-ghost{color:var(--color-text-muted);border-color:var(--color-divider)}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text)}
.btn-danger{background:var(--color-error);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-icon{width:44px;padding:0}
.btn-stack{display:flex;flex-direction:column;gap:var(--space-2);align-items:stretch}
.card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / .12);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--shadow-sm)}
@media (min-width:768px){.card{padding:var(--space-6)}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;background:color-mix(in oklab,var(--color-primary) 12%,var(--color-surface));color:var(--color-primary);border:1px solid color-mix(in oklab,var(--color-primary) 24%,transparent)}
.badge-ok{background:color-mix(in oklab,var(--color-success) 12%,var(--color-surface));color:var(--color-success);border-color:color-mix(in oklab,var(--color-success) 30%,transparent)}
.chip{--h:175;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;text-decoration:none;color:var(--color-text);background:var(--color-surface);border:1px solid oklch(62% .12 var(--h) / .6);box-shadow:inset 0 0 0 100px oklch(62% .12 var(--h) / .12)}
.chip:hover{box-shadow:inset 0 0 0 100px oklch(62% .12 var(--h) / .22)}
.chip.warn{border-color:var(--color-warning)}
.chip svg{color:var(--color-warning)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-4)}
.field>label{font-size:var(--text-sm);font-weight:600}
.input{width:100%;min-height:44px;padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface-2);color:var(--color-text)}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:2px solid var(--color-primary);outline-offset:2px;border-color:var(--color-primary)}
.err{display:flex;align-items:center;gap:6px;color:var(--color-error);font-size:var(--text-sm)}
.hint{font-size:var(--text-sm);color:var(--color-text-muted)}
.form-row{display:grid;gap:var(--space-4);grid-template-columns:1fr}
@media (min-width:560px){.form-row{grid-template-columns:1fr 1fr}}
.alert{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);margin-bottom:var(--space-4);background:color-mix(in oklab,var(--color-warning) 12%,var(--color-surface));color:var(--color-warning)}
.alert.ok{background:color-mix(in oklab,var(--color-success) 12%,var(--color-surface));color:var(--color-success)}
.alert.bad{background:color-mix(in oklab,var(--color-error) 12%,var(--color-surface));color:var(--color-error)}
.alert svg{flex:none;margin-top:3px}
dialog{border:1px solid var(--color-divider);border-radius:var(--radius-xl);padding:var(--space-6);background:var(--color-surface);color:var(--color-text);width:min(640px,calc(100% - 24px));max-height:92dvh;overflow:auto;box-shadow:var(--shadow-lg);margin:auto}
dialog::backdrop{background:oklch(0 0 0 / .5)}
dialog h2{font-size:var(--text-lg);margin-bottom:var(--space-4)}
dialog h3{font-size:var(--text-base);margin:var(--space-5) 0 var(--space-2)}
.modal-actions{display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:flex-end;margin-top:var(--space-4)}
#lightbox{padding:var(--space-3);width:min(900px,calc(100% - 16px))}
#lightbox img{width:100%;border-radius:var(--radius-md)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:300;max-width:calc(100% - 24px);background:var(--color-text);color:var(--color-bg);padding:var(--space-3) var(--space-5);border-radius:var(--radius-xl);font-size:var(--text-sm);box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity var(--ease)}
.toast.show{opacity:1}
@media (min-width:768px){.toast{bottom:var(--space-8)}}
.skeleton{border-radius:var(--radius-lg);background:var(--color-surface-offset);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.empty{padding:var(--space-8) var(--space-4);border:1px dashed var(--color-border);border-radius:var(--radius-lg);color:var(--color-text-muted)}
.empty h3{color:var(--color-text);font-size:var(--text-lg);margin-bottom:var(--space-2)}
.empty .btn{margin-top:var(--space-4)}
table.diff{width:100%;border-collapse:collapse;font-size:var(--text-sm);margin:var(--space-3) 0}
table.diff th,table.diff td{padding:var(--space-2);border-bottom:1px solid var(--color-divider);text-align:right}
table.diff th:first-child,table.diff td:first-child{text-align:left}
table.diff thead th{font-weight:700;color:var(--color-text-muted)}
.steps-guide{list-style:decimal;padding-left:var(--space-6);display:flex;flex-direction:column;gap:var(--space-2)}
.steps-guide li{max-width:none}
.page-header{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-end;justify-content:space-between;margin-bottom:var(--space-6)}
.page-title{font-size:var(--text-xl)}
.page-sub{color:var(--color-text-muted);font-size:var(--text-sm)}
.section-title{font-size:var(--text-lg);margin:var(--space-8) 0 var(--space-4);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3)}
.grid-2{display:grid;gap:var(--space-4);grid-template-columns:1fr}
@media (min-width:900px){.grid-2{grid-template-columns:1fr 1fr}}
.stats{display:grid;gap:var(--space-3);grid-template-columns:1fr 1fr;margin-bottom:var(--space-6)}
@media (min-width:768px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:var(--space-4)}
.stat dt{font-size:var(--text-xs);color:var(--color-text-muted)}
.stat dd{font-size:var(--text-xl);font-weight:700;letter-spacing:-.02em}
.list{list-style:none;display:flex;flex-direction:column;gap:var(--space-2)}
.list li{max-width:none}
.row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-offset);text-decoration:none;color:inherit;min-height:44px;transition:background var(--ease)}
.row .grow{flex:1;min-width:0}
.row strong{display:block}
.thumb{width:52px;height:52px;border-radius:var(--radius-md);object-fit:cover;background:var(--color-primary-highlight);color:var(--color-primary);display:flex;align-items:center;justify-content:center;flex:none}
.letters{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-bottom:var(--space-4)}
.letters button{min-width:44px;min-height:44px;border-radius:var(--radius-md);border:1px solid var(--color-divider);font-weight:700;color:var(--color-primary)}
.letters button:hover{background:var(--color-primary-highlight)}
.species{margin-bottom:var(--space-6)}
.species h2{font-size:var(--text-lg);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.count{font-size:var(--text-sm);font-weight:400;color:var(--color-text-muted)}
.var-list{list-style:none;display:grid;gap:var(--space-2);grid-template-columns:1fr}
.var-list li{max-width:none}
@media (min-width:768px){.var-list{grid-template-columns:1fr 1fr}}
.var-list .row{border:1px solid var(--color-divider);background:var(--color-surface)}
.var-list .row:hover{background:var(--color-surface-offset)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-3)}
.crumbs a{color:var(--color-text-muted)}
.plant-head{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start;justify-content:space-between}
.plant-photo{width:100%;max-height:300px;object-fit:cover;border-radius:var(--radius-lg);margin-bottom:var(--space-4)}
@media (min-width:768px){.plant-photo{width:240px;height:240px;float:right;margin:0 0 var(--space-4) var(--space-6)}}
.facts{display:flex;flex-wrap:wrap;gap:var(--space-2);margin:var(--space-3) 0}
.pager{display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-6)}
.steps{list-style:none;display:grid;gap:var(--space-2);grid-template-columns:1fr;margin-top:var(--space-3)}
@media (min-width:640px){.steps{grid-template-columns:1fr 1fr}}
.steps li{max-width:none;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-offset);flex-wrap:wrap}
.steps .label-s{flex:1;font-size:var(--text-sm);min-width:120px}
.steps .none{color:var(--color-text-faint)}
.culture-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3)}
.gallery{display:flex;gap:var(--space-2);flex-wrap:wrap}
.gallery button{padding:0;border-radius:var(--radius-md);overflow:hidden;width:84px;height:84px}
.gallery img{width:100%;height:100%;object-fit:cover}
.entry{padding:var(--space-4) 0;border-bottom:1px solid var(--color-divider)}
.entry:last-child{border-bottom:0}
.entry img{max-width:260px;border-radius:var(--radius-md);margin-top:var(--space-2);cursor:zoom-in}
.entry-meta{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);font-size:var(--text-sm);color:var(--color-text-muted)}
.bed-grid{display:grid;gap:var(--space-4);grid-template-columns:1fr}
@media (min-width:900px){.bed-grid{grid-template-columns:1fr 1fr}}
.bed-title{display:flex;align-items:center;gap:var(--space-3)}
.bed-title button{padding:0;border-radius:var(--radius-md)}
.year-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--color-divider)}
.year-row .y{width:48px;font-weight:700;flex:none}
.year-row .cells{flex:1;display:flex;flex-wrap:wrap;gap:var(--space-2)}
.canvas-wrap{position:relative;height:240px}
.pwa-hide{display:none}

:root,[data-theme="light"]{--lvl-ok:#437a22;--lvl-mid:#8a6d00;--lvl-warn:#b45309;--lvl-bad:#b91c1c}
[data-theme="dark"]{--lvl-ok:#6daa45;--lvl-mid:#d4b13a;--lvl-warn:#e08a4a;--lvl-bad:#ef6b6b}
.lvl-ok{--c:var(--lvl-ok)}.lvl-mid{--c:var(--lvl-mid)}.lvl-warn{--c:var(--lvl-warn)}.lvl-bad{--c:var(--lvl-bad)}.lvl-unk{--c:var(--color-text-muted)}
.lvl{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:700;color:var(--c);background:color-mix(in oklab,var(--c) 14%,var(--color-surface));border:1px solid color-mix(in oklab,var(--c) 40%,transparent)}
.stat.lvl-ok dd,.stat.lvl-mid dd,.stat.lvl-warn dd,.stat.lvl-bad dd{color:var(--c)}
.seed-filters{display:grid;gap:var(--space-3);grid-template-columns:1fr;margin-bottom:var(--space-5);align-items:end}
@media (min-width:768px){.seed-filters{grid-template-columns:2fr 1fr auto}}
.seed-filters label.chk{display:flex;align-items:center;gap:var(--space-2);min-height:44px}
.lots{list-style:none;display:grid;gap:var(--space-2);margin-top:var(--space-3)}
.lots li{max-width:none}
.lot{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border:1px solid var(--color-divider);border-left:6px solid var(--c);border-radius:var(--radius-md);background:var(--color-surface)}
.lot.lot-out{opacity:.6}
.lot-main{flex:1 1 260px;min-width:0}
.lot-title{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);font-weight:700}
.lot-sub{font-size:var(--text-sm);color:var(--color-text-muted)}
.lot-tools{display:flex;gap:var(--space-2)}
.life-table td,.life-table th{padding:6px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--color-divider);font-size:var(--text-sm)}
</style>
</head>
<body>
<a href="#view" class="sr-only">Aller au contenu principal</a>

<header class="app-header" role="banner">
  <a href="#/home" class="logo" aria-label="Potager Nexus, accueil">
    <i data-lucide="sprout" width="26" height="26" aria-hidden="true"></i> Potager Nexus
  </a>
  <div class="header-actions">
    <button class="btn btn-ghost pwa-hide" id="btn-install" data-act="install"><i data-lucide="download" width="18" height="18" aria-hidden="true"></i><span class="btn-label">Installer</span></button>
    <button class="btn btn-primary" data-act="new-plant"><i data-lucide="plus" width="18" height="18" aria-hidden="true"></i><span class="btn-label">Nouvelle fiche</span></button>
    <button class="btn btn-ghost btn-icon" id="theme-toggle" aria-label="Basculer le thème"></button>
  </div>
</header>

<div class="backup-bar" id="backup-bar" role="region" aria-label="Sauvegarde des données"></div>

<nav class="sidenav" aria-label="Navigation principale">
  <a href="#/home" data-nav="home"><i data-lucide="layout-dashboard" width="24" height="24" aria-hidden="true"></i>Accueil</a>
  <a href="#/lexique" data-nav="lexique"><i data-lucide="book-open" width="24" height="24" aria-hidden="true"></i>Lexique</a>
  <a href="#/graines" data-nav="graines"><i data-lucide="wheat" width="24" height="24" aria-hidden="true"></i>Graines</a>
  <a href="#/jardin" data-nav="jardin"><i data-lucide="map" width="24" height="24" aria-hidden="true"></i>Jardin</a>
  <a href="#/data" data-nav="data"><i data-lucide="database" width="24" height="24" aria-hidden="true"></i>Données</a>
</nav>

<main id="view" tabindex="-1">

  <div class="skeleton" style="height:96px;margin-bottom:16px"></div>

<script>

/* =====================================================================
   Constants & helpers
===================================================================== */
const APP_VERSION = 3;
const SEED_TS = '2026-01-01T00:00:00.000Z';
const COLLECTIONS = ['plants','cultures','beds','entries','photos','seeds'];
const STEPS = [
  { key:'semis',      label:'Semis',                 icon:'sprout' },
  { key:'rempotage',  label:'Rempotage',             icon:'flower-2' },
  { key:'plantation', label:'Plantation',            icon:'shovel' },
  { key:'recolte1',   label:'Première récolte',      icon:'apple' },
  { key:'recolte2',   label:'Dernière récolte',      icon:'shopping-basket' },
  { key:'graines',    label:'Ramassage des graines', icon:'wheat' }
];
const FAMILIES = ['Solanacées','Cucurbitacées','Fabacées','Apiacées','Astéracées','Brassicacées','Alliacées','Amaranthacées','Poacées','Rosacées','Lamiacées','Autre'];
const ROTATION_YEARS = 3;
const SUN = ['Plein soleil','Mi-ombre','Ombre'];
const BED_TYPES = ['Carré','Serre','Butte','Bac / pot','Rang en pleine terre','Verger'];
const SPECIES_FAMILY = {
  tomate:'Solanacées', aubergine:'Solanacées', poivron:'Solanacées', piment:'Solanacées', 'pomme de terre':'Solanacées',
  courgette:'Cucurbitacées', concombre:'Cucurbitacées', potiron:'Cucurbitacées', courge:'Cucurbitacées', melon:'Cucurbitacées', pasteque:'Cucurbitacées',
  haricot:'Fabacées', pois:'Fabacées', feve:'Fabacées',
  carotte:'Apiacées', persil:'Apiacées', celeri:'Apiacées', panais:'Apiacées', fenouil:'Apiacées',
  laitue:'Astéracées', salade:'Astéracées', chicoree:'Astéracées', endive:'Astéracées', tournesol:'Astéracées',
  chou:'Brassicacées', radis:'Brassicacées', navet:'Brassicacées', roquette:'Brassicacées',
  oignon:'Alliacées', ail:'Alliacées', poireau:'Alliacées', echalote:'Alliacées', ciboulette:'Alliacées',
  betterave:'Amaranthacées', epinard:'Amaranthacées', blette:'Amaranthacées',
  mais:'Poacées', fraisier:'Rosacées', basilic:'Lamiacées', menthe:'Lamiacées', thym:'Lamiacées'
};

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3);
const ico = (n, s=20) => `<i data-lucide="${n}" width="${s}" height="${s}" aria-hidden="true"></i>`;
const refreshIcons = () => { if (window.lucide) window.lucide.createIcons(); };
const isoDate = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const today = () => isoDate(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return isoDate(d); };
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}) : '';
const fmtDT = iso => iso ? new Date(iso).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
const nowISO = () => new Date().toISOString();
const byId = (arr,id) => arr.find(x => x.id === id);
const label = p => p ? `${p.species} ${p.variety}` : '—';
const hue = fam => { let h=0; for (const c of String(fam||'x')) h=(h*31+c.charCodeAt(0))%360; return h; };
const famGuess = sp => { const n = norm(sp); if (!n) return ''; if (SPECIES_FAMILY[n]) return SPECIES_FAMILY[n]; const k = Object.keys(SPECIES_FAMILY).find(k => n.startsWith(k) || (n.length>3 && k.startsWith(n))); return k ? SPECIES_FAMILY[k] : ''; };
const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const famOfPlant = id => (byId(state.plants,id)||{}).family || '';
const touch = o => { o.updatedAt = nowISO(); return o; };
const tomb = id => { state.tombstones[id] = nowISO(); };
const guessDevice = () => /Android/i.test(navigator.userAgent) ? 'Android' : /iPhone|iPad/i.test(navigator.userAgent) ? 'iPhone' : 'PC';
const makeMeta = () => ({ deviceId:uid(), deviceName:guessDevice(), lastExportAt:null, lastImportAt:null, dirty:false });

/* =====================================================================
   Storage — IndexedDB only (no localStorage)
===================================================================== */
const DB = {
  db:null, ok:false,
  open(){ return new Promise(res => { try {
      const r = indexedDB.open('potager-nexus',1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; this.ok = true; res(true); };
      r.onerror = () => res(false); r.onblocked = () => res(false);
    } catch(e){ res(false); } }); },
  get(k){ return new Promise(res => { if(!this.ok) return res(null);
      const q = this.db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); }); },
  set(k,v){ return new Promise(res => { if(!this.ok) return res(false);
      try { const t = this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k);
        t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false); } catch(e){ res(false); } }); }
};
let state = { plants:[], cultures:[], beds:[], entries:[], photos:[], seeds:[], tombstones:{}, meta:makeMeta() };
let saveTimer, backupAvailable = false;
function persist(markDirty=true){
  if (markDirty) state.meta.dirty = true;
  updateBackupBar();
  clearTimeout(saveTimer); saveTimer = setTimeout(() => DB.set('state', state), 250);
}
window.addEventListener('beforeunload', e => { if (state.meta && state.meta.dirty && (state.plants.length || state.cultures.length)) { e.preventDefault(); e.returnValue = ''; } });

/* =====================================================================
   Photos — full (1280px) + thumbnail (320px)
===================================================================== */
const loadImage = src => new Promise((res,rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Image invalide')); i.src = src; });
const readAsDataURL = f => new Promise((res,rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Lecture impossible')); fr.readAsDataURL(f); });
function resizeImg(img, max, q){
  const k = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement('canvas'); c.width = Math.max(1,Math.round(img.width*k)); c.height = Math.max(1,Math.round(img.height*k));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg', q);
}
async function processPhoto(file){
  if (!file) throw new Error('Aucun fichier');
  const img = await loadImage(await readAsDataURL(file));
  return { full:resizeImg(img,1280,.8), thumb:resizeImg(img,320,.6) };
}
const photoOf = id => state.photos.find(p => p.id===id);
const photoSrc = (id, full=false) => { const p = id && photoOf(id); return p ? (full ? (p.full||p.thumb) : (p.thumb||p.full)) : null; };
function addPhoto(px, ownerType, base, st=state){
  const b = slug(base) || 'photo'; let n = 1, file;
  do { file = `${b}-${String(n).padStart(3,'0')}`; n++; } while (st.photos.some(p => p.file===file));
  const ph = { id:uid(), file, ownerType, thumb:px.thumb, full:px.full||null, updatedAt:nowISO() };
  st.photos.push(ph); return ph.id;
}
function removePhoto(id){ if (!id) return; state.photos = state.photos.filter(p => p.id!==id); tomb(id); }
function removeItems(key, pred){
  state[key] = state[key].filter(x => { if (pred(x)) { tomb(x.id); if (x.photo) removePhoto(x.photo); return false; } return true; });
}

/* =====================================================================
   Normalisation (migration v1 → v2) & merge
===================================================================== */
async function normalizeState(s, stamp=nowISO()){
  COLLECTIONS.forEach(k => { if (!Array.isArray(s[k])) s[k] = []; s[k].forEach(x => { if (!x.updatedAt) x.updatedAt = stamp; }); });
  s.tombstones = (s.tombstones && typeof s.tombstones==='object') ? s.tombstones : {};
  const owners = [['plants','fiche'],['entries','note'],['beds','emplacement']];
  for (const [k,type] of owners) for (const o of s[k]) {
    if (typeof o.photo === 'string' && o.photo.startsWith('data:')) {
      try {
        const img = await loadImage(o.photo);
        const base = k==='beds' ? o.name : k==='plants' ? o.species : ((byId(s.plants,o.plantId)||{}).species || 'photo');
        o.photo = addPhoto({ full:o.photo, thumb:resizeImg(img,320,.6) }, type, base, s);
      } catch(e){ o.photo = null; }
    }
  }
  for (const p of s.photos) if (!p.thumb && p.full) { try { p.thumb = resizeImg(await loadImage(p.full),320,.6); } catch(e){} }
  s.photos = s.photos.filter(p => p.thumb || p.full);
  return s;
}
function mergePhoto(newer, older){ return { ...newer, full:newer.full||older.full||null, thumb:newer.thumb||older.thumb||null }; }
function mergeStates(L, R){
  const out = { tombstones:{} }, stats = {};
  const tombs = { ...L.tombstones };
  Object.keys(R.tombstones||{}).forEach(id => { if (!tombs[id] || R.tombstones[id] > tombs[id]) tombs[id] = R.tombstones[id]; });
  COLLECTIONS.forEach(k => {
    const s = { added:0, updated:0, removed:0, same:0 };
    const lm = new Map(L[k].map(x => [x.id,x])), rm = new Map((R[k]||[]).map(x => [x.id,x]));
    out[k] = [];
    new Set([...lm.keys(), ...rm.keys()]).forEach(id => {
      const l = lm.get(id), r = rm.get(id), t = tombs[id];
      const lu = l ? l.updatedAt||'' : '', ru = r ? r.updatedAt||'' : '';
      if (t && t >= (lu > ru ? lu : ru)) { if (l) s.removed++; return; }
      if (l && !r) { out[k].push(l); s.same++; }
      else if (!l && r) { out[k].push(r); s.added++; }
      else if (ru > lu) { out[k].push(k==='photos' ? mergePhoto(r,l) : r); s.updated++; }
      else { out[k].push(k==='photos' ? mergePhoto(l,r) : l); s.same++; }
    });
    stats[k] = s;
  });
  out.tombstones = tombs;
  return { merged:out, stats };
}

/* =====================================================================
   Rotation logic
===================================================================== */
function rotConflicts(bedId, year, family, excludeId){
  if (!bedId || !family || family==='Autre') return [];
  return state.cultures.filter(c => c.bedId===bedId && c.id!==excludeId && famOfPlant(c.plantId)===family
    && Math.abs(c.year-year)>=1 && Math.abs(c.year-year)<=ROTATION_YEARS);
}
function bedAvoid(bedId, year){
  const set = new Set();
  state.cultures.filter(c => c.bedId===bedId && year-c.year>=1 && year-c.year<=ROTATION_YEARS)
    .forEach(c => { const f = famOfPlant(c.plantId); if (f && f!=='Autre') set.add(f); });
  return [...set];
}

/* =====================================================================
   Theme, toast, modal, backup bar
===================================================================== */
let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  const b = $('#theme-toggle');
  b.innerHTML = ico(theme==='dark' ? 'sun' : 'moon', 20);
  b.setAttribute('aria-label', `Passer en mode ${theme==='dark' ? 'clair' : 'sombre'}`);
  refreshIcons();
}
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
const modal = $('#modal');
function openModal(html){ modal.innerHTML = html; refreshIcons(); if (!modal.open) modal.showModal(); const f = modal.querySelector('input:not([type=file]),select,textarea'); if (f) f.focus(); }
function closeModal(){ if (modal.open) modal.close(); }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
$('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') e.currentTarget.close(); });
let pendingConfirm = null;
function confirmBox(msg, onOk){
  pendingConfirm = onOk;
  openModal(`<h2 id="modal-title">Confirmer</h2><p>${esc(msg)}</p>
    <div class="modal-actions"><button class="btn btn-secondary" data-act="close">Annuler</button><button class="btn btn-danger" data-act="confirm-ok">${ico('trash-2',18)} Confirmer</button></div>`);
}
function updateBackupBar(){
  const bar = $('#backup-bar'); if (!bar) return;
  const m = state.meta;
  bar.classList.toggle('dirty', !!m.dirty);
  const last = m.lastExportAt ? `Dernière sauvegarde : ${fmtDT(m.lastExportAt)}.` : 'Aucune sauvegarde faite sur cet appareil.';
  const msg = m.dirty
    ? `${ico('triangle-alert',20)}<span><strong>Modifications non sauvegardées.</strong> ${last}</span>`
    : `${ico('circle-check',20)}<span>Aucune modification en attente. ${last}</span>`;
  bar.innerHTML = `<div class="backup-status">${msg}</div><button class="btn btn-primary" data-act="open-backup">${ico('save',18)} Sauvegarder / Restaurer via fichier JSON</button>`;
  refreshIcons();
}

/* =====================================================================
   Views
===================================================================== */
const sortedPlants = () => [...state.plants].sort((a,b) => a.species.localeCompare(b.species,'fr') || a.variety.localeCompare(b.variety,'fr'));
const coverOf = p => p.photo || ([...state.entries].filter(e => e.plantId===p.id && e.photo).sort((a,b) => b.date.localeCompare(a.date))[0] || {}).photo || null;
const thumbHtml = p => { const s = photoSrc(coverOf(p)); return s ? `<img class="thumb" src="${s}" alt="Photo de ${esc(label(p))}" width="52" height="52" loading="lazy">` : `<span class="thumb">${ico('leaf',24)}</span>`; };

function vHome(){
  const Y = new Date().getFullYear(), t = today(), lim = addDays(30);
  const cur = state.cultures.filter(c => c.year===Y);
  const kg = cur.reduce((s,c) => s + (+c.harvestKg||0), 0);
  const species = new Set(state.plants.map(p => norm(p.species))).size;
  const up = [];
  state.cultures.forEach(c => STEPS.forEach(s => { const d = c.dates && c.dates[s.key]; if (d && d>=t && d<=lim) up.push({d,s,c}); }));
  up.sort((a,b) => a.d.localeCompare(b.d));
  const recent = [...state.entries].sort((a,b) => b.date.localeCompare(a.date)).slice(0,4);
  return `
  <div class="main-inner">
    <div class="page-header"><div><h1 class="page-title">Mon potager</h1><p class="page-sub">Saison ${Y} · vue d\u2019ensemble</p></div></div>
    ${seedHomeAlert()}
    <dl class="stats">
      <div class="stat"><dt>Fiches</dt><dd>${state.plants.length}</dd></div>
      <div class="stat"><dt>Espèces</dt><dd>${species}</dd></div>
      <div class="stat"><dt>Cultures ${Y}</dt><dd>${cur.length}</dd></div>
      <div class="stat"><dt>Récolte ${Y}</dt><dd>${kg.toLocaleString('fr-FR',{maximumFractionDigits:1})} kg</dd></div>
    </dl>
    <div class="grid-2">
      <section class="card" aria-labelledby="h-up">
        <h2 id="h-up" style="font-size:var(--text-lg);margin-bottom:var(--space-3)">À venir · 30 jours</h2>

function lexList(q){
  const n = norm(q);
  if (!state.plants.length) return `<div class="empty"><h3>Votre lexique est vide</h3><p>Créez votre première fiche, par exemple une tomate « Red Zebra », ou restaurez une sauvegarde.</p><button class="btn btn-primary" data-act="new-plant">${ico('plus',18)} Nouvelle fiche</button></div>`;
  const items = sortedPlants().filter(p => !n || norm(`${p.species} ${p.variety} ${p.family}`).includes(n));
  if (!items.length) return `<div class="empty"><h3>Aucun résultat</h3><p>Aucune fiche ne correspond à « ${esc(q)} ».</p></div>`;
  const groups = new Map();
  items.forEach(p => { const k = norm(p.species); if (!groups.has(k)) groups.set(k,{name:p.species,family:p.family,list:[]}); groups.get(k).list.push(p); });
  const letters = [...new Set([...groups.values()].map(g => (norm(g.name)[0]||'#').toUpperCase()))];
  const first = L => slug([...groups.values()].find(g => (norm(g.name)[0]||'#').toUpperCase()===L).name);
  return `<div class="letters" role="group" aria-label="Index alphabétique">${letters.map(L => `<button data-act="jump" data-id="sp-${first(L)}" aria-label="Aller à la lettre ${L}">${L}</button>`).join('')}</div>` +
    [...groups.values()].map(g => `<section class="species" id="sp-${slug(g.name)}" aria-label="${esc(g.name)}">
      <h2>${esc(g.name)} <span class="count">${g.list.length} variété${g.list.length>1?'s':''}</span>${g.family?`<span class="badge">${esc(g.family)}</span>`:''}</h2>
      <ul class="var-list">${g.list.map(p => { const cs = state.cultures.filter(c => c.plantId===p.id); const last = cs.length ? Math.max(...cs.map(c => c.year)) : null;
        return `<li><a class="row" href="#/plant/${p.id}">${thumbHtml(p)}<span class="grow"><strong>${esc(p.variety)}</strong><span class="muted">${cs.length} culture${cs.length>1?'s':''}${last?' · dernière : '+last:''}</span></span>${ico('chevron-right',18)}</a></li>`; }).join('')}</ul>
    </section>`).join('');
}

const pend = { plant:null, entry:null, bed:null };
let pendingLexQ = '', pendingImport = null;
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('input[type=file][data-photo]')) {
    const kind = t.dataset.photo, prev = document.getElementById('prev-'+kind);
    try {
      pend[kind] = await processPhoto(t.files[0]);
      if (prev) prev.innerHTML = `<img src="${pend[kind].thumb}" alt="Aperçu de la photo" width="120" height="120" style="width:120px;height:120px;object-fit:cover;border-radius:8px">`;
    } catch(err){ if (prev) { prev.innerHTML = `<p class="err">${ico('circle-alert',16)} ${esc(err.message)}</p>`; refreshIcons(); } }
  }
  if (t.id === 'f-species') { const fam = $('#f-family'); if (fam && !fam.dataset.touched) fam.value = famGuess(t.value) || fam.value; }
  if (t.closest('form[data-form=culture]') && ['c-plant','c-bed','c-year'].includes(t.id)) updateRotWarn();
  if (t.id === 'dev-name') { state.meta.deviceName = t.value.trim() || guessDevice(); persist(false); }
  if (t.id === 'restore-file') { const f = t.files[0]; t.value = ''; handleRestoreFile(f); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-family') e.target.dataset.touched = '1';
  if (e.target.id === 'lex-q') { $('#lex-list').innerHTML = lexList(e.target.value); refreshIcons(); }
  if (e.target.id === 'dev-name') { const n = $('#bk-name'); if (n) { state.meta.deviceName = e.target.value.trim() || guessDevice(); n.textContent = exportName('zip'); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('label[for][tabindex]')) { const i = document.getElementById(e.target.getAttribute('for')); if (i) i.click(); }
});

const handlers = {

    showErr(f,'plantId',!fd.plantId); showErr(f,'year',!yOk); if (!fd.plantId || !yOk) return;

    if (f.dataset.id) touch(Object.assign(byId(state.cultures,f.dataset.id), data)); else state.cultures.push(touch({ id:uid(), ...data }));
    persist(); closeModal(); toast('Culture enregistrée'); render();
  },
  bed(f){
    const fd = Object.fromEntries(new FormData(f)); const name = fd.name.trim(); showErr(f,'name',!name); if (!name) return;
    const data = { name, type:fd.type, area:fd.area===''?'':+fd.area, notes:fd.notes.trim() };
    let b = f.dataset.id ? byId(state.beds,f.dataset.id) : null;

};

/* =====================================================================
   Backup / restore — JSON + ZIP, explicit, merge-based
===================================================================== */
const pad = n => String(n).padStart(2,'0');
const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; };
const exportName = ext => `potager-nexus-export-${stamp()}-${slug(state.meta.deviceName) || 'appareil'}.${ext}`;
const canShareFiles = () => { try { return !!(navigator.canShare && navigator.canShare({ files:[new File(['x'],'a.zip',{type:'application/zip'})] })); } catch(e){ return false; } };

function exportPayload(embedThumbs){
  const counts = {}; COLLECTIONS.forEach(k => counts[k] = state[k].length);
  return {
    format:'potager-nexus', version:APP_VERSION,
    meta:{ exportedAt:nowISO(), deviceId:state.meta.deviceId, deviceName:state.meta.deviceName, photos:embedThumbs ? 'miniatures-incluses' : 'dossier-photos', counts },
    data:{
      plants:state.plants, cultures:state.cultures, beds:state.beds, entries:state.entries, seeds:state.seeds, tombstones:state.tombstones,
      photos:state.photos.map(p => ({ id:p.id, file:p.file, ownerType:p.ownerType, updatedAt:p.updatedAt, hasFull:!!p.full, ...(embedThumbs ? { thumb:p.thumb } : {}) }))
    }
  };
}
async function buildExport(kind){
  if (kind === 'json') {
    return { blob:new Blob([JSON.stringify(exportPayload(true), null, 1)], { type:'application/json' }), name:exportName('json') };
  }
  if (!window.JSZip) throw new Error('Bibliothèque ZIP non chargée : connectez-vous une fois à Internet puis rechargez la page.');
  const zip = new JSZip();
  zip.file('donnees.json', JSON.stringify(exportPayload(false), null, 1));
  const folder = zip.folder('photos');
  state.photos.forEach(p => {
    if (p.thumb) folder.file(`${p.file}-thumb.jpg`, p.thumb.split(',')[1], { base64:true });
    if (p.full) folder.file(`${p.file}.jpg`, p.full.split(',')[1], { base64:true });
  });
  const raw = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{ level:6 } });
  return { blob:new Blob([raw], { type:'application/zip' }), name:exportName('zip') };
}
async function saveBlob(blob, name){
  const ext = name.split('.').pop();
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName:name, types:[{ description:ext==='zip' ? 'Archive ZIP' : 'Fichier JSON', accept: ext==='zip' ? { 'application/zip':['.zip'] } : { 'application/json':['.json'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return 'saved';
    } catch(e){ if (e && e.name === 'AbortError') return 'cancel'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return 'saved';
}
async function doExport(kind, share=false){
  document.querySelectorAll('#modal [data-act^=bk-]').forEach(b => b.disabled = true);
  try {
    const { blob, name } = await buildExport(kind);
    let r = 'saved';
    if (share) {
      const file = new File([blob], name, { type:blob.type });
      if (!(navigator.canShare && navigator.canShare({ files:[file] }))) throw new Error('Le partage de fichiers n\u2019est pas disponible ici.');
      await navigator.share({ files:[file], title:'Sauvegarde Potager Nexus' });
    } else r = await saveBlob(blob, name);
    if (r === 'saved') { state.meta.lastExportAt = nowISO(); state.meta.dirty = false; persist(false); toast(`Sauvegarde créée : ${name}`); }
  } catch(e){ if (!(e && e.name === 'AbortError')) toast(e.message || 'Échec de la sauvegarde'); }
  if (modal.open) openBackup();
}

async function readBackupFile(file){
  const isZip = /\.zip$/i.test(file.name) || file.type === 'application/zip' || file.type === 'application/x-zip-compressed';
  let j, zip = null;
  if (isZip) {
    if (!window.JSZip) throw new Error('Bibliothèque ZIP non chargée : connectez-vous une fois à Internet puis rechargez la page.');
    zip = await JSZip.loadAsync(file);
    const f = zip.file('donnees.json') || zip.file(/(^|\/)donnees\.json$/)[0];
    if (!f) throw new Error('« donnees.json » est introuvable dans ce ZIP.');
    j = JSON.parse(await f.async('string'));
  } else j = JSON.parse(await file.text());
  const d = j.data || j;
  if (!d || !Array.isArray(d.plants) || !Array.isArray(d.cultures)) throw new Error('Ce fichier n\u2019est pas une sauvegarde Potager Nexus.');
  const meta = j.meta || { exportedAt:j.exportedAt };
  const remote = { plants:d.plants, cultures:d.cultures, beds:d.beds||[], entries:d.entries||[], seeds:d.seeds||[], photos:[], tombstones:d.tombstones||{} };
  for (const rp of (d.photos||[])) {
    if (!rp || !rp.id) continue;
    const ph = { id:rp.id, file:rp.file, ownerType:rp.ownerType, updatedAt:rp.updatedAt, thumb:rp.thumb||null, full:null };
    if (zip && rp.file) {
      const tf = zip.file(`photos/${rp.file}-thumb.jpg`); if (tf) ph.thumb = 'data:image/jpeg;base64,' + await tf.async('base64');
      const ff = zip.file(`photos/${rp.file}.jpg`); if (ff && rp.hasFull !== false) ph.full = 'data:image/jpeg;base64,' + await ff.async('base64');
    }
    remote.photos.push(ph);
  }
  await normalizeState(remote, meta.exportedAt || nowISO());
  return { remote, meta, kind:isZip ? 'zip' : 'json' };
}
async function handleRestoreFile(file){
  if (!file) return;
  toast('Analyse du fichier…');
  try {
    const parsed = await readBackupFile(file);
    const { merged, stats } = mergeStates(state, parsed.remote);
    pendingImport = { ...parsed, merged, stats, fileName:file.name };
    openModal(importPreviewHtml());
  } catch(err){
    openModal(`<h2 id="modal-title">Fichier non utilisable</h2><div class="alert bad" role="alert">${ico('circle-alert',18)}<span>${esc(err.message || 'Lecture impossible.')}</span></div>
      <div class="modal-actions"><button class="btn btn-secondary" data-act="open-backup">Retour</button></div>`);
  }
}
const LBL = { plants:'Fiches', cultures:'Cultures', beds:'Emplacements', entries:'Notes', seeds:'Lots de graines', photos:'Photos' };
function importPreviewHtml(){
  const pi = pendingImport, st = pi.stats, m = state.meta, rm = pi.meta || {};
  const older = rm.exportedAt && m.lastExportAt && rm.exportedAt < m.lastExportAt;
  const rows = COLLECTIONS.map(k => `<tr><td>${LBL[k]}</td><td>${st[k].added}</td><td>${st[k].updated}</td><td>${st[k].removed}</td><td>${st[k].same}</td></tr>`).join('');
  return `<h2 id="modal-title">Restaurer : aperçu</h2>
    <p class="muted">Fichier « ${esc(pi.fileName)} » · ${pi.kind==='zip' ? 'ZIP avec photos complètes' : 'JSON avec miniatures'}${rm.exportedAt ? ` · créé le ${fmtDT(rm.exportedAt)}` : ''}${rm.deviceName ? ` sur « ${esc(rm.deviceName)} »` : ''}.</p>
    ${older ? `<div class="alert" style="margin-top:var(--space-3)" role="alert">${ico('triangle-alert',18)}<span>Ce fichier est plus ancien que votre dernière sauvegarde (${fmtDT(m.lastExportAt)}). Vérifiez que c\u2019est le bon.</span></div>` : ''}
    ${m.dirty ? `<div class="alert" style="margin-top:var(--space-3)" role="alert">${ico('triangle-alert',18)}<span>Vous avez des modifications non sauvegardées. « Fusionner » les conserve ; « Remplacer » les écrase.</span></div>` : ''}
    <table class="diff"><caption class="sr-only">Résultat prévu de la fusion</caption>
      <thead><tr><th scope="col">Élément</th><th scope="col">Ajoutés</th><th scope="col">Mis à jour</th><th scope="col">Supprimés</th><th scope="col">Inchangés</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">Fusion : pour chaque élément, la version la plus récente gagne ; les suppressions sont reprises. Rien n\u2019est modifié avant votre choix, et une copie de sécurité est gardée.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" data-act="open-backup">Annuler</button>
      <button class="btn btn-danger" data-act="apply-replace">${ico('replace',18)} Remplacer tout</button>
      <button class="btn btn-primary" data-act="apply-merge">${ico('git-merge',18)} Fusionner</button>
    </div>`;
}
async function applyImport(mode){
  const pi = pendingImport; if (!pi) return;
  backupAvailable = await DB.set('backup', { savedAt:nowISO(), state });
  const meta = { ...state.meta, lastImportAt:nowISO() };
  if (mode === 'merge') {
    state = { ...pi.merged, meta:{ ...meta, dirty:true } };
  } else {
    const r = pi.remote;
    r.photos.forEach(rp => { if (!rp.full) { const lp = photoOf(rp.id); if (lp && lp.full) rp.full = lp.full; } });
    state = { plants:r.plants, cultures:r.cultures, beds:r.beds, entries:r.entries, seeds:r.seeds||[], photos:r.photos, tombstones:r.tombstones, meta:{ ...meta, dirty:false } };
  }
  pendingImport = null; persist(false); closeModal();
  toast(mode === 'merge' ? 'Fusion appliquée. Pensez à sauvegarder le résultat.' : 'Sauvegarde restaurée.');
  render();
}
function openBackup(){
  const m = state.meta;
  const noFull = state.photos.filter(p => !p.full).length;
  const last = m.lastExportAt ? `Dernière sauvegarde : ${fmtDT(m.lastExportAt)}.` : 'Aucune sauvegarde faite sur cet appareil.';
  openModal(`<h2 id="modal-title">Sauvegarder / Restaurer</h2>
    <div class="alert ${m.dirty ? '' : 'ok'}" role="status">${ico(m.dirty ? 'triangle-alert' : 'circle-check', 18)}<span>${m.dirty ? 'Modifications non sauvegardées. ' : 'Aucune modification en attente. '}${last}${m.lastImportAt ? ` Dernière restauration : ${fmtDT(m.lastImportAt)}.` : ''}</span></div>
    <div class="field"><label for="dev-name">Nom de cet appareil</label><input class="input" id="dev-name" value="${esc(m.deviceName)}" autocomplete="off"><span class="hint">Ajouté au nom du fichier (PC, Android…) pour que deux appareils ne s\u2019écrasent jamais dans OneDrive.</span></div>

    <p class="hint" style="margin-bottom:var(--space-3)">Nom du fichier : <span id="bk-name">${esc(exportName('zip'))}</span><br>${state.photos.length} photo${state.photos.length>1?'s':''}${noFull ? `, dont ${noFull} en miniature seulement sur cet appareil` : ''}.</p>
    <div class="btn-stack">
      <button class="btn btn-primary" data-act="bk-zip">${ico('archive',18)} ZIP complet : données + photos</button>
      <button class="btn btn-secondary" data-act="bk-json">${ico('file-json',18)} JSON seul : données + miniatures</button>
      ${canShareFiles() ? `<button class="btn btn-secondary" data-act="bk-share">${ico('share-2',18)} Partager le ZIP (OneDrive, Drive…)</button>` : ''}
    </div>
    <h3>2. Restaurer</h3>
    <label class="btn btn-secondary" for="restore-file" tabindex="0" style="width:100%">${ico('upload',18)} Choisir un fichier .zip ou .json</label>

    <p class="hint" style="margin-top:var(--space-2)">Un aperçu s\u2019affiche avant toute modification.</p>
    <div class="modal-actions"><button class="btn btn-secondary" data-act="close">Fermer</button></div>`);
}

const SEED_LIFE_SRC = 'https://www.pomologie.fr/duree-germinative-des-graines-potageres-les-points-a-connaitre/';
const SEED_LIFE_VEG = {
  1:['Haricot','Panais'],
  2:['Cerfeuil','Maïs','Oignon','Persil','Salsifis','Scorsonère'],
  3:['Aneth','Carotte','Laitue','Piment','Pissenlit','Poireau','Pois','Poivron'],
  4:['Arachide','Arroche','Brocoli','Ciboulette','Cresson','Fenouil','Mâche','Pastèque','Pâtisson','Romarin','Roquette','Sauge','Tétragone','Thym','Tomate'],
  5:['Asperge','Bette','Betterave','Chou','Épinard','Melon','Navet','Radis','Rutabaga'],
  6:['Aubergine','Coriandre','Fève'],
  7:['Artichaut','Tournesol'],
  8:['Basilic','Céleri','Chicorée','Courgette'],
  9:['Physalis'],
  10:['Concombre','Courge']
};
const SEED_LIFE_FLOWER = {
  1:['Balsamine','Dahlia','Impatiens','Primevère'],
  2:['Agératum','Ancolie','Clarkia','Cléome','Coléus','Gloxinia','Muflier','Pavot','Pyrèthre','Reine-marguerite'],
  3:['Agastache','Capucine','Centaurée','Chrysanthème','Cosmos','Godétia','Lupin','Némésia','Nigelle','Œillet','Pâquerette','Zinnia'],
  4:['Alysse','Coréopsis','Ipomée','Molène','Pensée','Phacélie','Ricin','Rose trémière','Rudbeckia','Scabieuse','Souci'],
  5:['Campanule','Gaillarde','Giroflée','Immortelle','Lobélia','Myosotis','Tagète','Pois de senteur'],
  6:['Cinéraire','Pétunia'],
  7:['Amarante','Bégonia'],
  8:['Bourrache','Réséda']
};
const SEED_ALIAS = { potiron:'courge', potimarron:'courge', butternut:'courge', citrouille:'courge', giraumon:'courge', salade:'laitue', batavia:'laitue', romaine:'laitue', endive:'chicoree', mais:'mais', oignons:'oignon', 'haricot vert':'haricot' };
const nrm2 = s => norm(s).replace(/œ/g,'oe');
const SEED_INDEX = (() => {
  const out = [];
  const add = (obj, kind) => Object.entries(obj).forEach(([y,names]) => names.forEach(name => out.push({ key:nrm2(name), name, years:+y, kind })));
  add(SEED_LIFE_VEG,'potager'); add(SEED_LIFE_FLOWER,'fleur');
  Object.entries(SEED_ALIAS).forEach(([a,t]) => { const ref = out.find(o => o.key===t); if (ref && a!==t) out.push({ key:a, name:ref.name, years:ref.years, kind:ref.kind, alias:true }); });
  out.forEach(o => { o.re = new RegExp('(^|[^a-z])' + o.key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[sx]?($|[^a-z])'); });
  return out.sort((a,b) => b.key.length - a.key.length);
})();
const LVL = {
  ok:  { short:'Bon état',        icon:'circle-check' },
  mid: { short:'À utiliser',      icon:'clock' },
  warn:{ short:'Dernière saison', icon:'triangle-alert' },
  bad: { short:'Périmé',          icon:'octagon-alert' },
  unk: { short:'Durée inconnue',  icon:'circle-help' }
};
const LVL_RANK = { bad:0, warn:1, mid:2, ok:3, unk:4 };
const plural = (n, w) => `${n} ${w}${n>1?'s':''}`;

function seedRef(sd){
  if (sd.lifeYears !== '' && sd.lifeYears != null && +sd.lifeYears > 0) return { years:+sd.lifeYears, name:'Durée personnalisée', custom:true };
  const n = nrm2(sd.species); if (!n) return null;
  const hit = SEED_INDEX.find(o => o.re.test(n));
  return hit ? { years:hit.years, name:hit.name, custom:false } : null;
}
function seedStatus(sd, Y=new Date().getFullYear()){
  const ref = seedRef(sd), age = Math.max(0, Y - (+sd.vintage || Y));
  if (!ref) return { lvl:'unk', age, ref:null, msg:'Durée de conservation inconnue pour cette espèce : renseignez-la dans le lot.' };
  const ratio = age / ref.years;
  let lvl = ratio < .5 ? 'ok' : ratio < .8 ? 'mid' : ratio <= 1 ? 'warn' : 'bad';
  let note = '';
  const gp = (sd.germPct === '' || sd.germPct == null) ? null : +sd.germPct;
  if (gp !== null && !isNaN(gp)) {
    if (gp < 50 && lvl !== 'bad') { lvl = 'bad'; note = ` Germination mesurée faible (${gp} %).`; }
    else if (gp < 70 && (lvl === 'ok' || lvl === 'mid')) { lvl = 'warn'; note = ` Germination mesurée moyenne (${gp} %).`; }
    else note = ` Germination mesurée : ${gp} %.`;
  }
  const left = ref.years - age;
  const base = age > ref.years ? `Dépassé de ${plural(age-ref.years,'an')} (référence : ${plural(ref.years,'an')}).`
    : left === 0 ? `Dernière saison recommandée (référence : ${plural(ref.years,'an')}).`
    : `${plural(left,'an')} restant${left>1?'s':''} sur ${ref.years}.`;
  return { lvl, age, ref, msg:base + note };
}
const seedAgeTxt = age => age === 0 ? 'de cette année' : plural(age,'an');
const seedActive = () => state.seeds.filter(s => !s.empty);
function seedAlerts(){ return seedActive().map(s => ({ s, st:seedStatus(s) })).filter(x => x.st.lvl==='warn' || x.st.lvl==='bad'); }
function seedHomeAlert(){

  const parts = [bad ? `${plural(bad,'lot')} périmé${bad>1?'s':''}` : '', warn ? `${plural(warn,'lot')} en dernière saison` : ''].filter(Boolean).join(' · ');
  return `<div class="alert" role="status">${ico('wheat',18)}<span><strong>Graines :</strong> ${parts}. <a href="#/graines">Voir le stock</a></span></div>`;
}

function seedListHtml(){
  const q = norm(seedUI.q);

    confirmBox(`Supprimer le lot « ${sd.species} ${sd.variety} ${sd.vintage} » ?`, () => { removeItems('seeds', x => x.id === sd.id); persist(); toast('Lot supprimé'); render(); }); },
  'seed-from-culture': el => { const c = byId(state.cultures, el.dataset.id), p = c && byId(state.plants, c.plantId); if (!c || !p) return;
    openModal(seedForm({ plantId:p.id, species:p.species, variety:p.variety, vintage:c.year, origin:'recolte', cultureId:c.id, unit:'graines' })); updateSeedHint(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 's-species' || t.id === 's-life') updateSeedHint();
  if (t.id === 'seed-q') { seedUI.q = t.value; refreshSeedList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'seed-lvl') { seedUI.lvl = t.value; refreshSeedList(); }
  if (t.id === 'seed-out') { seedUI.out = t.checked; refreshSeedList(); }
  if (t.id === 's-plant') { const p = byId(state.plants, t.value); if (p) { $('#s-species').value = p.species; $('#s-variety').value = p.variety; updateSeedHint(); } }
  if (t.id === 's-culture') { const c = byId(state.cultures, t.value), p = c && byId(state.plants, c.plantId);
    if (c && p) { $('#s-plant').value = p.id; $('#s-species').value = p.species; $('#s-variety').value = p.variety; $('#s-vintage').value = c.year; $('#s-origin').value = 'recolte'; updateSeedHint(); } }
});

/* =====================================================================
   Router & chart
===================================================================== */
function parseRoute(){ const h = location.hash.replace(/^#\/?/,'') || 'home'; const [name,id] = h.split('/'); return { name, id }; }
let lastRoute = '', chart = null;
function drawChart(){
  const cv = $('#chart-harvest'); if (!cv) return;
  if (chart) { chart.destroy(); chart = null; }
  const wrap = cv.parentElement;
  const by = {}; state.cultures.forEach(c => { if (+c.harvestKg) by[c.year] = (by[c.year]||0) + (+c.harvestKg); });
  const years = Object.keys(by).sort();
  if (!window.Chart) { wrap.innerHTML = '<p class="muted">Graphique indisponible (bibliothèque non chargée).</p>'; return; }
  if (!years.length) { wrap.innerHTML = '<div class="empty"><h3>Pas encore de récolte</h3><p>Renseignez les kilos récoltés dans vos cultures.</p></div>'; return; }
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  chart = new Chart(cv, { type:'bar',
    data:{ labels:years, datasets:[{ label:'Récolte (kg)', data:years.map(y => Math.round(by[y]*10)/10), backgroundColor:g('--color-primary'), borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
      scales:{ x:{ ticks:{ color:g('--color-text-muted') }, grid:{ display:false } }, y:{ beginAtZero:true, ticks:{ color:g('--color-text-muted') }, grid:{ color:g('--color-divider') } } } } });
}
function render(){
  const r = parseRoute();
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === (r.name==='plant' ? 'lexique' : r.name)) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const views = { home:vHome, lexique:vLex, plant:vPlant, jardin:vGarden, graines:vSeeds, data:vData };
  const main = $('#view');
  try { main.innerHTML = (views[r.name] || vHome)(r); }
  catch(err){ main.innerHTML = `<div class="alert bad" role="alert">${ico('circle-alert',18)}<span>Erreur d\u2019affichage : ${esc(err.message)}. Sauvegardez vos données puis rechargez la page.</span></div>`; }
  updateBackupBar();
  refreshIcons();
  if (r.name==='home') drawChart();
  if (r.name==='lexique' && pendingLexQ) { const i = $('#lex-q'); if (i) { i.value = pendingLexQ; $('#lex-list').innerHTML = lexList(pendingLexQ); refreshIcons(); } pendingLexQ = ''; }
  const key = r.name + '/' + (r.id||''); if (key !== lastRoute) { window.scrollTo(0,0); lastRoute = key; }
}
window.addEventListener('hashchange', render);

/* =====================================================================
   Init
===================================================================== */
async function init(){
  applyTheme();
  await DB.open();
  const saved = await DB.get('state');
  const bk = await DB.get('backup'); backupAvailable = !!bk;
  if (saved && Array.isArray(saved.plants)) {
    state = await normalizeState(saved);
    state.meta = { ...makeMeta(), ...(saved.meta||{}) };
  } else {
    state = await normalizeState(seed(), SEED_TS); state.meta = makeMeta(); persist(false);
  }
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('load', init);
</script>
